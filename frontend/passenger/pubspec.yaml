name: tricygo_passenger
description: TricyGo Passenger Ride-Hailing Flutter Mobile Application
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  cupertino_icons: ^1.0.6
  flutter_map: ^7.0.1
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  shared_preferences: ^2.2.2
  socket_io_client: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true